<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>Corum</title>
  <script type="importmap">
    {
      "imports": {
        "corum:ui": "/sdk/index.js",
        "corum:ui/react": "/sdk/react.js",
        "htm": "/vendor/htm.module.js",
        "react": "/vendor/shims/react.js",
        "react-dom": "/vendor/shims/react-dom.js",
        "react-dom/client": "/vendor/shims/react-dom-client.js",
        "react/jsx-runtime": "/vendor/shims/react-jsx-runtime.js",
        "reactflow": "/vendor/shims/reactflow.js",
        "elkjs": "/vendor/shims/elkjs.js"
      }
    }
  </script>
  <script id="theme-boot">
    /* First paint: keep in agreement with resolveTheme/readChoice in host/theme.js (test/theme.test.ts). The registry is
       not known yet, so a stored theme id is applied as is (its CSS is already in the page: /api/themes.css below) and
       host/boot.js corrects it once the plugin list is in (a theme of a disabled plugin falls back to System). */
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('corum:theme'); } catch (e) {}
      if (typeof t !== 'string' || t === 'system' || !/^[a-z0-9-]+$/.test(t)) {
        t = 'light';
        try { if (matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; } catch (e) {}
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="/vendor/fonts.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/api/themes.css" />
  <link rel="stylesheet" href="/vendor/fontawesome.css" />
  <link rel="stylesheet" href="/vendor/solid.css" />
  <link rel="stylesheet" href="/vendor/reactflow.css" />
</head>
<body>
  <div id="root"></div>

  <script src="/vendor/react.umd.js"></script>
  <script src="/vendor/react-dom.umd.js"></script>
  <script src="/vendor/elk.bundled.js"></script>
  <script src="/vendor/reactflow.umd.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <script src="router.js"></script>
  <script type="module" src="host/boot.js"></script>
  <script type="text/babel" src="search.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
